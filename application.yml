spring:
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:NONE}
      chat:
        options:
          model: claude-haiku-4-5
          max-tokens: 8192
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_dev}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
logging:
  level:
    claudeagent: DEBUG
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %highlight(%-5level) %msg%n"
  file:
    name: logs/agent.log   
